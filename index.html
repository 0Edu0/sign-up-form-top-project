<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Up Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="left-column">
        <div class="banner">
            <img src="images/side-photo.png" alt="">
            <p>Odin</p>
        </div>

        <div class="credits">
            <p>Photo by <a href="https://unsplash.com/@haliewestphoto" target="_blank">Halie West</a> on <a
                    href="https://unsplash.com/" target="_blank">Unsplash</a></p>
        </div>
    </div>

    <div class="right-column">
        <div class="first-row">
            <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. <br>Sign up <i>now</i> to get started. <br> <br>You know you want to.</p>
        </div>
        <form>
            <div class="second-row">
                <h2>Let's do this!</h2>
                <div class="form-row">
                    <div class="form-field">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name" name="first_name" required>
                    </div>
                    <div class="form-field">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" name="last_name" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-field">
                        <label for="email">Email</label>
                        <input type="email" name="mail" id="email" required>
                    </div>
                    <div class="form-field">
                        <label for="phone_number">Phone Number</label>
                        <input type="tel" name="phone_number" id="phone_number" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-field">
                        <label for="password">Password</label>
                        <input type="password" name="password" id="password" pattern="^(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[a-zA-Z]).{8,}$" required>
                    </div>
                    <div class="form-field">
                        <label for="conf_password">Confirm Password</label>
                        <input type="password" name="conf_password" id="conf_password" pattern="^(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[a-zA-Z]).{8,}$" required>
                    </div>
                </div>
            </div>
            <div class="third-row">
                <button type="submit">Create Account</button>
                <p>Already have an account? <a href="">Log in</a></p>
            </div>
        </form>
    </div>
</body>

</html>
